<g><text class="lead rot" x="56" y="188" style="animation-delay:0s"><tspan fill-opacity="0">I build </tspan><tspan class="hl">firmware for ESP32 and STM32 microcontrollers</tspan></text><text class="lead rot" x="56" y="188" style="animation-delay:3s"><tspan fill-opacity="0">I build </tspan><tspan class="hl">autonomous rovers with LiDAR and stereo cameras</tspan></text><text class="lead rot" x="56" y="188" style="animation-delay:6s"><tspan fill-opacity="0">I build </tspan><tspan class="hl">machine-vision systems that sort and inspect</tspan></text><text class="lead rot" x="56" y="188" style="animation-delay:9s"><tspan fill-opacity="0">I build </tspan><tspan class="hl">license-plate recognition with gate control</tspan></text></g>
