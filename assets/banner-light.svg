<title id="t">Lahiru Maduranga · Embedded Systems Engineer</title>
<desc id="d">Lahiru Maduranga, Embedded Systems Engineer in Sri Lanka with more than five years of hands-on experience across firmware, robotics, IoT, computer vision, and edge AI.</desc>
