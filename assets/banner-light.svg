<g style="animation:l0 12s linear infinite"><text class="con" x="698" y="102"><tspan fill="#E21B2D">&gt;</tspan> rst: power-on · ROM boot</text></g><g class="pending" style="animation:p0 12s linear infinite"><text class="con" x="698" y="119"><tspan fill="#5d6068">[ .. ]</tspan> bootloader</text></g><g class="final" style="animation:k0 12s linear infinite"><text class="con" x="698" y="119"><tspan fill="#1a7f37" font-weight="700">[ OK ]</tspan> bootloader <tspan fill="#5d6068">partition table</tspan></text></g><g class="pending" style="animation:p1 12s linear infinite"><text class="con" x="698" y="135"><tspan fill="#5d6068">[ .. ]</tspan> clocks</text></g><g class="final" style="animation:k1 12s linear infinite"><text class="con" x="698" y="135"><tspan fill="#1a7f37" font-weight="700">[ OK ]</tspan> clocks <tspan fill="#5d6068">PLL · peripheral clocks</tspan></text></g><g class="pending" style="animation:p2 12s linear infinite"><text class="con" x="698" y="151"><tspan fill="#5d6068">[ .. ]</tspan> watchdog</text></g><g class="final" style="animation:k2 12s linear infinite"><text class="con" x="698" y="151"><tspan fill="#1a7f37" font-weight="700">[ OK ]</tspan> watchdog <tspan fill="#5d6068">armed</tspan></text></g><g class="pending" style="animation:p3 12s linear infinite"><text class="con" x="698" y="167"><tspan fill="#5d6068">[ .. ]</tspan> peripherals</text></g><g class="final" style="animation:k3 12s linear infinite"><text class="con" x="698" y="167"><tspan fill="#1a7f37" font-weight="700">[ OK ]</tspan> peripherals <tspan fill="#5d6068">UART · I²C · SPI · CAN</tspan></text></g><g class="pending" style="animation:p4 12s linear infinite"><text class="con" x="698" y="183"><tspan fill="#5d6068">[ .. ]</tspan> scheduler</text></g><g class="final" style="animation:k4 12s linear infinite"><text class="con" x="698" y="183"><tspan fill="#1a7f37" font-weight="700">[ OK ]</tspan> scheduler <tspan fill="#5d6068">RTOS started</tspan></text></g>
